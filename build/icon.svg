<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Claude Term アプリアイコン。macOS Big Sur 形式(1024 グリッド、本体 824 squircle)。
       ダークターミナル背景 + Claude コーラルのプロンプトが本体。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e35"/>
      <stop offset="0.55" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8865f"/>
      <stop offset="1" stop-color="#c96442"/>
    </linearGradient>
  </defs>

  <!-- 本体 squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="103" y="103" width="818" height="818" rx="182" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <!-- プロンプト ❯ (ハロー付き) -->
  <path d="M 325 386 L 471 512 L 325 638" fill="none" stroke="#d97757" stroke-opacity="0.16"
        stroke-width="118" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 325 386 L 471 512 L 325 638" fill="none" stroke="url(#prompt)"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- カーソル(アンダースコア) -->
  <rect x="531" y="604" width="168" height="48" rx="14" fill="#e8e8ec" fill-opacity="0.14" transform="translate(0,0) scale(1)"/>
  <rect x="537" y="610" width="156" height="36" rx="10" fill="#e8e8ec"/>
</svg>
