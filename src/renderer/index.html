<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
  />
  <title>Claude Term</title>
  <link rel="stylesheet" href="./renderer.css" />
</head>
<body>
  <div id="titlebar">Claude Term</div>
  <div id="app">
    <main id="main-pane">
      <div id="term-host"></div>
      <div id="search-bar" class="hidden">
        <input id="search-input" type="text" placeholder="検索" spellcheck="false" />
        <span id="search-count"></span>
        <button id="search-prev" title="前へ (Shift+Enter)">↑</button>
        <button id="search-next" title="次へ (Enter)">↓</button>
        <button id="search-close" title="閉じる (Esc)">×</button>
      </div>
      <div id="placeholder">
        <p class="placeholder-title">セッションがありません</p>
        <p class="placeholder-sub">右上の「＋ new」で新しいターミナルを起動</p>
      </div>
    </main>
    <div id="splitter"></div>
    <aside id="sidebar">
      <header id="sidebar-head">
        <span id="sidebar-title">起動ターミナル</span>
        <button id="new-btn" title="新しいターミナルを起動">＋ new</button>
      </header>
      <div id="session-list"></div>
    </aside>
  </div>
  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div id="settings-head">
        <span>外観設定</span>
        <button id="settings-close" title="閉じる (Esc)">×</button>
      </div>
      <label class="settings-row">
        <span>背景の透過</span>
        <span class="settings-ctrl">
          <input id="set-opacity" type="range" min="20" max="100" step="1" />
          <span id="set-opacity-val"></span>
        </span>
      </label>
      <label class="settings-row">
        <span>背景色</span>
        <input id="set-bg" type="color" />
      </label>
      <label class="settings-row">
        <span>文字色</span>
        <input id="set-fg" type="color" />
      </label>
      <label class="settings-row">
        <span>アクセント色</span>
        <input id="set-accent" type="color" />
      </label>
      <div id="settings-foot">
        <button id="settings-reset">デフォルトに戻す</button>
      </div>
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
